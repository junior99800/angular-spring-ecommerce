<header class="navbar">
    <div class="navbar-logo">DS Catalog</div>
    <nav class="navbar-menu">
        <a [routerLink]="['/paginas']" class="menu-item">HOME</a>
        <a [routerLink]="['/catalogo']" class="menu-item">CATÁLOGO</a>
        <a [routerLink]="['/admin/produtos']" class="menu-item active">ADMIN</a>
    </nav>
</header>

<div class="admin-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <nav class="sidebar-menu">
            <a [routerLink]="['/admin/produtos']" class="menu-item active">Produtos</a>
            <a href="#" class="menu-item">Categorias</a>
            <a href="#" class="menu-item">Usuários</a>
        </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <div class="form-card">
            <!-- TÍTULO ALTERADO AQUI -->
            <h2>CADASTRO DE PRODUTO</h2>

            <form (ngSubmit)="salvar()">
                <div class="form-grid">
                    <!-- Lado Esquerdo -->
                    <div class="left-col">
                        <div class="input-group">
                            <input type="text" [(ngModel)]="produtoForm.name" name="name" placeholder="Nome do Produto" required>
                        </div>

                        <div class="input-group">
                            <select [(ngModel)]="categoriaSelecionadaId" name="categoria">
                                <option [ngValue]="null" disabled selected>Categorias</option>
                                @for (cat of categorias; track cat.id) {
                                    <option [ngValue]="cat.id">{{ cat.name }}</option>
                                }
                            </select>
                        </div>

                        <div class="input-group">
                            <input type="number" [(ngModel)]="produtoForm.price" name="price" placeholder="Preço" required>
                        </div>

                        <div class="upload-area">
                            <input type="file" id="fileUpload" (change)="onFileSelected($event)" hidden>
                            <label for="fileUpload" class="btn-upload">ADICIONAR IMAGEM</label>
                            <p class="help-text">As imagens devem ser JPG ou PNG e não devem ultrapassar <strong>5 mb</strong>.</p>
                        </div>
                    </div>

                    <!-- Lado Direito -->
                    <div class="right-col">
                        <textarea [(ngModel)]="produtoForm.description" name="description" placeholder="Descrição" required></textarea>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" (click)="cancelar()">CANCELAR</button>
                    <button type="submit" class="btn-save">SALVAR</button>
                </div>
            </form>
        </div>
    </main>
</div>
